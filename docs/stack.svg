<svg xmlns="http://www.w3.org/2000/svg" width="960" height="752" viewBox="0 0 960 752" role="img" aria-label="The engine as a stack of layers on Seedance: reading, grounding, direction, the model; the gates and the remix as rails beside it."><defs><marker id="arr-paper" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9fb0d0"/></marker></defs><rect width="960" height="752" rx="18" fill="#fbfcfe"/><rect x="350" y="24" width="220" height="44" rx="22" fill="#eef2f9" stroke="#2d62c8" stroke-width="1.2"/><text x="460" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1b2a4a" text-anchor="middle">A sentence</text><text x="460" y="59" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b8c" text-anchor="middle">what the maker typed</text><path d="M460 68 V90" stroke="#9fb0d0" stroke-width="1.4" marker-end="url(#arr-paper)"/><text x="24" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1b2a4a" >A remix</text><text x="24" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b8c" >enters as a sentence that changes a video,</text><text x="24" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b8c" >and comes back in at the layer it reaches</text><text x="726" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1b2a4a" >The gates</text><text x="726" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b8c" >a refusal at every layer, each with its</text><text x="726" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b6b8c" >own reason, and doubt never refuses</text><rect x="220" y="134" width="480" height="118" rx="12" fill="#eef2f9" stroke="#9fb0d0" stroke-width="1"/><text x="236" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#2d62c8" >1</text><text x="258" y="159" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1b2a4a" >Reading</text><text x="236" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1b2a4a" >What the maker meant, decided once, before anything is searched.</text><rect x="236" y="222" width="80" height="22" rx="11" fill="#fbfcfe" stroke="#9fb0d0"/><text x="276" y="237" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5b6b8c" text-anchor="middle">the reading</text><rect x="322" y="222" width="80" height="22" rx="11" fill="#fbfcfe" stroke="#9fb0d0"/><text x="362" y="237" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5b6b8c" text-anchor="middle">the planner</text><rect x="408" y="222" width="98" height="22" rx="11" fill="#fbfcfe" stroke="#9fb0d0"/><text x="457" y="237" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5b6b8c" text-anchor="middle">the media form</text><rect x="512" y="222" width="92" height="22" rx="11" fill="#fbfcfe" stroke="#9fb0d0"/><text x="558" y="237" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5b6b8c" text-anchor="middle">appropriation</text><rect x="610" y="222" width="62" height="22" rx="11" fill="#fbfcfe" stroke="#9fb0d0"/><text x="641" y="237" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5b6b8c" text-anchor="middle">the cast</text><path d="M700 152 H720" stroke="#9fb0d0" stroke-width="1" stroke-dasharray="3 3"/><circle cx="720" cy="152" r="3" fill="#2d62c8"/><text x="730" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6b8c" >A famous or owned name is</text><text x="730" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6b8c" >declined before anything is</text><text x="730" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6b8c" >looked up.</text><path d="M190 152 H218" stroke="#9fb0d0" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arr-paper)"/><circle cx="190" cy="152" r="3" fill="#2d62c8"/><text x="24" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6b8c" >A changed place or cast:</text><text x="24" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6b8c" >the whole stack again.</text><text x="684" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="400" fill="#5b6b8c" text-anchor="end">built on</text><rect x="220" y="262" width="480" height="118" rx="12" fill="#eef2f9" stroke="#9fb0d0" stroke-width="1"/><text x="236" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#2d62c8" >2</text><text x="258" y="287" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1b2a4a" >Grounding</text><text x="236" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1b2a4a" >The real world is found first. Real photographs of the place, the</text><text x="236" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1b2a4a" >media form, the figures.</text><rect x="236" y="350" width="92" height="22" rx="11" fill="#fbfcfe" stroke="#9fb0d0"/><text x="282" y="365" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5b6b8c" text-anchor="middle">sourceability</text><rect x="334" y="350" width="122" height="22" rx="11" fill="#fbfcfe" stroke="#9fb0d0"/><text x="395" y="365" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5b6b8c" text-anchor="middle">the query compiler</text><rect x="462" y="350" width="68" height="22" rx="11" fill="#fbfcfe" stroke="#9fb0d0"/><text x="496" y="365" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5b6b8c" text-anchor="middle">the hunts</text><rect x="536" y="350" width="74" height="22" rx="11" fill="#fbfcfe" stroke="#9fb0d0"/><text x="573" y="365" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5b6b8c" text-anchor="middle">the judges</text><path d="M700 280 H720" stroke="#9fb0d0" stroke-width="1" stroke-dasharray="3 3"/><circle cx="720" cy="280" r="3" fill="#2d62c8"/><text x="730" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6b8c" >No real photo can exist:</text><text x="730" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6b8c" >declined, with nothing searched.</text><text x="684" y="388" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="400" fill="#5b6b8c" text-anchor="end">built on</text><rect x="220" y="390" width="480" height="118" rx="12" fill="#eef2f9" stroke="#9fb0d0" stroke-width="1"/><text x="236" y="414" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#2d62c8" >3</text><text x="258" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1b2a4a" >Direction</text><text x="236" y="436" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1b2a4a" >The scene is written to the photograph, never before it.</text><rect x="236" y="478" width="74" height="22" rx="11" fill="#fbfcfe" stroke="#9fb0d0"/><text x="273" y="493" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5b6b8c" text-anchor="middle">frame zero</text><rect x="316" y="478" width="74" height="22" rx="11" fill="#fbfcfe" stroke="#9fb0d0"/><text x="353" y="493" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5b6b8c" text-anchor="middle">the writer</text><rect x="396" y="478" width="86" height="22" rx="11" fill="#fbfcfe" stroke="#9fb0d0"/><text x="439" y="493" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5b6b8c" text-anchor="middle">the beat law</text><rect x="488" y="478" width="80" height="22" rx="11" fill="#fbfcfe" stroke="#9fb0d0"/><text x="528" y="493" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5b6b8c" text-anchor="middle">the reviews</text><rect x="574" y="478" width="74" height="22" rx="11" fill="#fbfcfe" stroke="#9fb0d0"/><text x="611" y="493" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5b6b8c" text-anchor="middle">the editor</text><path d="M700 408 H720" stroke="#9fb0d0" stroke-width="1" stroke-dasharray="3 3"/><circle cx="720" cy="408" r="3" fill="#2d62c8"/><text x="730" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6b8c" >A story fault re-asks the writer;</text><text x="730" y="426" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6b8c" >a words fault is edited.</text><path d="M190 408 H218" stroke="#9fb0d0" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arr-paper)"/><circle cx="190" cy="408" r="3" fill="#2d62c8"/><text x="24" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6b8c" >A changed action, prop or</text><text x="24" y="426" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6b8c" >line: surgery here, every</text><text x="24" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6b8c" >photo reused.</text><text x="684" y="516" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="400" fill="#5b6b8c" text-anchor="end">built on</text><rect x="220" y="518" width="480" height="146" rx="12" fill="#e4ebf7" stroke="#2d62c8" stroke-width="1.2"/><text x="236" y="542" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#2d62c8" >4</text><text x="258" y="543" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1b2a4a" >Seedance</text><text x="236" y="564" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1b2a4a" >Seedance 2.5, directed. It is handed the photographs and the script.</text><text x="236" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1b2a4a" >It is never asked to invent the world.</text><rect x="236" y="606" width="158" height="22" rx="11" fill="#fbfcfe" stroke="#9fb0d0"/><text x="315" y="621" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5b6b8c" text-anchor="middle">the bag: four references</text><rect x="400" y="606" width="110" height="22" rx="11" fill="#fbfcfe" stroke="#9fb0d0"/><text x="455" y="621" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5b6b8c" text-anchor="middle">the prompt shape</text><rect x="236" y="634" width="74" height="22" rx="11" fill="#fbfcfe" stroke="#9fb0d0"/><text x="273" y="649" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5b6b8c" text-anchor="middle">the submit</text><rect x="316" y="634" width="116" height="22" rx="11" fill="#fbfcfe" stroke="#9fb0d0"/><text x="374" y="649" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#5b6b8c" text-anchor="middle">the repair ladder</text><path d="M700 536 H720" stroke="#9fb0d0" stroke-width="1" stroke-dasharray="3 3"/><circle cx="720" cy="536" r="3" fill="#2d62c8"/><text x="730" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6b8c" >The leak guard before it; the</text><text x="730" y="554" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6b8c" >output gate after.</text><path d="M190 124 V408" stroke="#9fb0d0" stroke-width="1" stroke-dasharray="3 3"/><path d="M720 124 V536" stroke="#9fb0d0" stroke-width="1" stroke-dasharray="3 3"/><path d="M460 664 V686" stroke="#9fb0d0" stroke-width="1.4" marker-end="url(#arr-paper)"/><rect x="380" y="690" width="160" height="38" rx="19" fill="#eef2f9" stroke="#2d62c8" stroke-width="1.2"/><text x="460" y="714" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1b2a4a" text-anchor="middle">The video</text></svg>
